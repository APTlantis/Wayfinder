[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aptlantis-wayfinder"
version = "0.1.0"
description = "Read-only Aptlantis workspace discovery and context-resolution CLI."
requires-python = ">=3.11"
authors = [{ name = "Herb" }]
license = { text = "MIT" }
dependencies = []

[project.scripts]
wayfinder = "wayfinder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
